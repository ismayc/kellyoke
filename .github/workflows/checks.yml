name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: data invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies and no network: these run against the committed output
      # files, so a broken invariant fails here rather than shipping.
      - name: Check data invariants
        run: python tools/check_data.py

      - name: Check prose conventions
        run: python tools/check_prose.py

      - name: Compile the pipeline
        run: python -m compileall -q pipeline
