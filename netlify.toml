# Netlify config for kellyokes.netlify.app
#
# The repo is private, and GitHub Pages needs a paid plan for private repos,
# so deployment goes through Netlify instead.
#
# The site is connected through Netlify's own Git integration, so Netlify runs
# [build] below on each push to main. That command runs the data checks first,
# which means a dataset that fails its own invariants fails the build instead of
# reaching the site.
#
# An earlier .github/workflows/netlify.yml did this from CI instead, to avoid
# giving Netlify read access to a private repo. It was removed once the Git
# integration was connected, because two deploy paths for one site is a way to
# ship the older of them.

[build]
  publish = "_site"
  command = """
    python3 tools/check_data.py && \
    mkdir -p _site && \
    cp index.html explore.html playlists.html performances.csv PLAYLISTS.md og-image.png _site/
  """

[build.environment]
  PYTHON_VERSION = "3.12"

# The pages are regenerated wholesale, so a stale copy is worse than a refetch.
# The CSV is a download, and can be cached harder.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/performances.csv"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/csv; charset=utf-8"

[[redirects]]
  from = "/explore"
  to = "/explore.html"
  status = 301

[[redirects]]
  from = "/playlists"
  to = "/playlists.html"
  status = 301

[[redirects]]
  from = "/data"
  to = "/performances.csv"
  status = 301
